[project]
name = "health-post-acute-infection-sciences"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "science",
]
# Workflow runner for the t035 cross-trigger pathway-overlap pipeline
# (code/workflows/). Pinned so the runner is reproducible from the repo env:
#   uv run --frozen --group pipeline snakemake -s code/workflows/Snakefile --use-conda -n
# (per-rule scientific stacks are pinned separately in code/workflows/envs/*.conda-lock.yml)
pipeline = [
    "snakemake==9.23.1",
    "conda-lock==4.0.1",
]

[tool.uv.sources]
science = { git = "https://github.com/khughitt/science.git", subdirectory = "science" }

# code/scripts/ holds rule-callable CLI scripts that import sibling modules
# (e.g. acquire_common). At runtime the script's own dir is on sys.path[0];
# declare it as an import root so static analysis resolves the same way.
[tool.pyright]
extraPaths = ["code/scripts"]

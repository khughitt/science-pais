  # hashed into the revision manifest — so editing a sweep log flipped the graph
  # to stale and made `science validate` warn about a file the graph does not
  # contain. Curation sweeps are necessarily written *after* the entity edits
  # they record, so the natural workflow guaranteed a dirty graph every time.
  # See fb-2026-07-17-001 and doc/curations/curation-sweep-2026-07-16.md.

# =============================================================================
# config.yaml — t139 frailty signature-projection feasibility packet (Step 2)
#
# SINGLE encoding of the locked parameters for the STEP-2 scope only:
# checksum-pinned GSE157007 GEX staging, donor mapping, pseudobulk, and the
# frail-vs-healthy-old signature (+ provenance). NO PAIS projection and NO
# target-label inspection at Step 2 (D-008 / pre-reg).
#
# Source of truth (frozen, re-frozen after Amendment 1):
#   doc/plans/2026-07-18-t139-frailty-projection-feasibility-preregistration.md
# Scope decision: core/decisions.md -> D-008
#
# Every value MIRRORS the pre-registration; rules read these and hard-code
# nothing. Changing a value is a pre-reg amendment, not a runtime edit.
# =============================================================================

# ----------------------------------------------------------------- paths -----
paths:
  raw: "data/raw/scrna/t139-frailty"
  processed: "data/processed/t139-frailty"
  results: "results/t139-frailty-feasibility"

# ------------------------------------------------------------------- geo -----
# GSE157007 — single-cell immune landscape of aging and frailty (PBMC scRNA +
# TCR + CITE). Verified 2026-07-18: 48 samples / 17 donors (3 cord, 3 young,
# 6 healthy-old, 5 frail). Only the scRNA GEX libraries feed pseudobulk [A1].
# sha256 PENDING-RETRIEVAL: recorded into the acquire manifest on first fetch,
# then locked here (record-or-verify; mismatch => HALT).
geo:
  series: "GSE157007"
  targets:
    series_matrix:
      url: "https://ftp.ncbi.nlm.nih.gov/geo/series/GSE157nnn/GSE157007/matrix/GSE157007_series_matrix.txt.gz"
      filename: "GSE157007_series_matrix.txt.gz"
      sha256: "321be57f4a0f823c69e17ff03d16a98f042f8b0dd0df06bd3629820a16531d69"  # locked 2026-07-18
    raw_tar:
      url: "https://ftp.ncbi.nlm.nih.gov/geo/series/GSE157nnn/GSE157007/suppl/GSE157007_RAW.tar"
      filename: "GSE157007_RAW.tar"
      sha256: "79efc3456e24ae48ff08324313e084626cdc517e5a055b0d300cf6dac077d5a2"  # locked 2026-07-18; 740761600 bytes

# -------------------------------------------------------- pinned references --
# Pinned NOW as hashed workflow inputs (per the Step-2 directive) even though
# they are consumed at PROJECTION time (Step 3+), so they cannot drift later.
refs:
  # Gate 3b deconvolution marker panel — MCPcounter major-lineage markers
  # (Becht 2016). Carries explicit Neutrophils + lymphoid (T/CD8/NK/B/cytotoxic)
  # lineages, which are the frozen r_platform composition axes. GitHub raw =
  # downloadable + hashable. sha256 recorded on first fetch, then locked.
  deconv_panel:
    name: "mcpcounter-genes"
    url: "https://raw.githubusercontent.com/ebecht/MCPcounter/master/Signatures/genes.txt"
    filename: "mcpcounter_genes.txt"
    sha256: "408f6c5d02c8f9bd2f1599c598367881853520934f8ce398a4886a8b296922bb"  # locked 2026-07-18; Neutrophils+T/CD8/NK/B/cytotoxic lineages present
  # Gene-mapping table (Ensembl gene id <-> HGNC symbol) — GENERATED
  # deterministically from the env-pinned bioconductor-org.Hs.eg.db so the map's
  # version is decoupled from any flaky download (same discipline as the
  # msigdbr-via-hashed-GMT precedent). The EMITTED tsv is hashed and locked.
  gene_map:
    name: "orgHsegdb-ensembl-symbol"
    source_pkg: "bioconductor-org.Hs.eg.db==3.22.0"
    out_rel: "refs/ensembl_symbol_map.tsv"
    sha256: "a908bdd55fab72a66f1afd24d6be775e87f8b4562e2e5a23b1f9560beffe8b60"  # locked 2026-07-18; 47792 pairs, deterministic emit

# -------------------------------------------------------------- contrast -----
# Frail vs healthy-old, at DONOR level. GEX modality only [A1].
contrast:
  case_group: "frail"          # 5 donors (verified)
  control_group: "healthy-old" # 6 donors (verified)
  unit: "donor"
  modality: "scRNA-GEX"        # sum raw GEX counts across the donor's cells; exclude VDJ/CITE

# ------------------------------------------------------------- signature -----
# Frozen pre-reg parameter 2 (single pipeline, no alternatives): limma-voom on
# raw pseudobulk counts. filterByExpr -> DGEList -> TMM -> voom -> lmFit(~frailty)
# -> eBayes -> topTable. Signature = signed genes with nominal p < 0.01 AND
# |log2FC| > 0.5, capped at top 200 by |log2FC|.
signature:
  method: "limma-voom"
  p_nominal_max: 0.01
  abs_log2fc_min: 0.5
  cap_top_n: 200

# ------------------------------------------------------- gate 1a (LODO) ------
# Operational definitions (Amendment 1): leave-one-donor-out over all 11 donors,
# full pipeline re-fit per fold; median pairwise Jaccard (union denominator);
# reproducible gene = selection frequency >= 0.8 (>= 9/11 folds).
lodo:
  reproducible_freq_min: 0.8
  jaccard_pass_min: 0.50
  jaccard_nogo_max: 0.30
  min_reproducible_genes: 20

# -------------------------------------------------- step 2b (Amendment 2) ----
# Batch-adjusted learnability gate (Gate 1a-adj), evaluated PRE-TARGET. Refit
# the frozen DE pipeline as ~ submission + frailty and re-check learnability +
# overlap with the frozen primary, using the SAME lodo thresholds above. The
# submission batch is a training-side confound surfaced at Step 2: F0xx submission
# = 5 frail + 3 healthy-old (GSM4750xxx); OH submission = 3 healthy-old, old-only
# (GSM5684xxx). Failure => NO-GO (primary signature was submission-driven);
# borderline => INCONCLUSIVE. See the pre-reg Amendment 2 for the full rationale.
step2b:
  # submission derived per donor and asserted against this expected cross-tab
  # (HALT on drift — the whole gate hinges on this structure):
  submission_levels: ["F0xx", "OH"]        # ref = F0xx (carries both arms)
  expected_crosstab:                        # submission -> {group: n_donors}
    F0xx: {frail: 5, healthy-old: 3}
    OH:   {frail: 0, healthy-old: 3}
  # Gate 1a-adj clears iff adjusted-LODO clears (lodo thresholds) AND the adjusted
  # signed signature overlaps the frozen primary at signed Jaccard >= this AND
  # >= min_shared_signed_genes shared signed genes; < nogo => NO-GO.
  signed_overlap_pass_min: 0.50
  signed_overlap_nogo_max: 0.30
  min_shared_signed_genes: 20

# ------------------------------------------------------------ determinism ----
determinism:
  seed: 20260718

    accession: "GCST90012111"
    trait: "shbg"
    sex: "combined"
    harmonised_dir: "https://ftp.ebi.ac.uk/pub/databases/gwas/summary_statistics/GCST90012001-GCST90013000/GCST90012111/harmonised/"
    build: "GRCh38"
    expected_sha256: "27c911dd81a8eb81c79e967efa758371a45935bb89447b49e88b73e5d703274d"
    n: 370125          # GWAS Catalog GCST90012111 initialSampleSize (European UKB continuous trait)

# ---------------------------------------------------------------- outcome ----
# plan:0009 — same authorised HGI vehicle as plan:0007 (D-006). GCST90454541 =
# broad cases / POPULATION controls. Binary → hm_beta is a log-OR. European-
# dominant multi-ancestry → the ancestry flag (KD1). The acquire rule also pulls
# the sibling *-meta.yaml so the case/control N is staged for MRlap total-N.
outcome:
  name: "covid19-hgi-longcovid-broad-population"
  accession: "GCST90454541"
  trait: "long-covid"
  harmonised_dir: "https://ftp.ebi.ac.uk/pub/databases/gwas/summary_statistics/GCST90454001-GCST90455000/GCST90454541/harmonised/"
  build: "GRCh38"
  expected_sha256: "bd7e0a0648608b69cab69b6dd9b6e7919dfcf640b6c035a3533a5d9bd00a6891"
  ancestry_note: "European-dominant multi-ancestry meta; no EUR-only sibling → ancestry flag (plan:0009 KD1, non-primary)."

# ------------------------------------------------- MRlap LDSC reference -------
# plan:0009 — dataset:eur-ldsc-ld-score-reference. MRlap runs cross-trait LDSC
# internally and needs `ld` (eur_w_ld_chr folder) + `hm3` (w_hm3.snplist).
# eur_w_ld_chr HARDENED to the DOI-archival, checksummed Zenodo mirror (record
# 8182036) — NOT MRlap's non-archival UT-Austin Box link (plan:0009 review Dim 3).
# w_hm3.snplist likewise on a DOI-archival, checksummed Zenodo mirror (record
# 7773502, md5-verified) — the Broad Alkes-group GCS bucket 404'd at staging.
ldsc_ref:
  name: "eur-ldsc-ld-score-reference"
  build: "GRCh37"                     # rsID-keyed; reconcile by rsID (build-independent)
  eur_w_ld_chr:
    url: "https://zenodo.org/api/records/8182036/files/eur_w_ld_chr.tar.gz/content"
    archive_name: "eur_w_ld_chr.tar.gz"
    md5: "e2f16343c4cfaa76caa7d0c03d26b489"
    doi: "10.5281/zenodo.8182036"
    license: "CC-BY-4.0"
  hm3:
    url: "https://zenodo.org/api/records/7773502/files/w_hm3.snplist.gz/content"
    archive_name: "w_hm3.snplist.gz"
    md5: "153ecc2bcfa740afafe656e6a384d769"
    doi: "10.5281/zenodo.7773502"
    license: "CC-BY-4.0"

# ------------------------------------------------------------ LD reference ---
# plan:0009 — dataset:1000g-eur-ld-panel (reused from plan:0007, Zenodo 6614170).
# Native GRCh37 → reconcile with GRCh38 sumstats by rsID (hm_rsid); else hard-stop.
ld_panel:
  name: "1000g-eur-phase3"
  superpopulation: "EUR"
  build: "GRCh37"
  doi: "10.5281/zenodo.6614170"
  license: "CC-BY-4.0"
  bfile_prefix: "1000G_EUR"
  files:
    bed:
      url: "https://zenodo.org/api/records/6614170/files/1000G_EUR.bed/content"
      md5: "a163c74ea92676c9ada76fe5eb3b2ec9"
    bim:
      url: "https://zenodo.org/api/records/6614170/files/1000G_EUR.bim/content"
      md5: "81b1ee40a05ef5be98ad3e496c71d708"
    fam:
      url: "https://zenodo.org/api/records/6614170/files/1000G_EUR.fam/content"
      md5: "669a4260fda7a9e1dd7df374aff294ea"

# --------------------------------------------------------------- env ----------
# plan:0009 Task 2. TwoSampleMR is not on conda; setup_twosamplemr installs the
# pinned tag (with ieugwasr for local clumping) into the r-mr env library and
# records resolved versions. Same pin as plan:0007 (v0.7.9). The conda-lock.yml
# is recorded provenance only — --use-conda materializes r-mr.yaml (F1). The R
# layer is the real drift risk, so setup HARD-FAILS unless the resolved
# versions match (both values from the plan:0007 run-of-record sentinel
# results/wave1-mr-pilot/.env/twosamplemr.ok: R 4.5.3, MendelianRandomization
# 0.10.0):
env:
  twosamplemr_repo: "MRCIEU/TwoSampleMR"
  twosamplemr_ref: "v0.7.9"
  twosamplemr_version_expected: "0.7.9"        # hard-fail if packageVersion != this
  ieugwasr_version_expected: "1.1.0"           # hard-fail if packageVersion != this

# ------------------------------------------------------- instrument -----------
# plan:0009 Task 2. Genome-wide-sig -> local 1000G-EUR clump -> F=(beta/se)^2.
# NO mhc_exclude — hormones are not HLA-dominated; the cis-SHBG signal is a
# legitimate instrument (plan:0009 Approach). Weak strata are quarantined, not
# fatal (eligible_for_mr:false + reason), per the Task-2 gate.
instrument:
  p_threshold: 5.0e-8
  clump_r2: 0.001
  clump_kb: 10000                    # 10 Mb
  f_min: 10                          # mean-F floor for MR eligibility
  min_instruments_mr: 3              # Egger/weighted-median eligibility floor
  target_instruments: 10             # quality flag only (not a gate)
  # mhc_exclude: (intentionally absent — no MHC exclusion for hormones)

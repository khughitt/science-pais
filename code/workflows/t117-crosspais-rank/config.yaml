# ------------------------------------------------------ salmon (SRA decoy) ----
# WP1 WIRES the SRA-only CHIKV decoy quantification path (PRJNA1001790, raw FASTQ
# only). The transcriptome + tx2gene + index + per-run quant + tximport rules are
# fully wired so the DAG resolves; the heavy index build + FASTQ retrieval + quant
# are DEFERRED to WP1b (env code/workflows/envs/salmon.yaml). Reference hashes are
# HALT-guarded (empty => fetch_url.py HALTs) and pinned on first verified fetch —
# the same fail-early discipline as the GEO acquisition above.
salmon:
  transcriptome:
    name: "gencode.v44.transcripts"
    url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_44/gencode.v44.transcripts.fa.gz"
    sha256: ""                          # HALT-guarded — pinned by WP1b on first verified fetch
  tx2gene:
    source: "gencode-fasta-headers"     # ENST→ENSG parsed from transcripts.fa headers (no extra download)
  index:
    kmer: 31                            # salmon --index -k
  runs:
    PRJNA1001790:
      source: "ena-filereport:PRJNA1001790"
      library_strategy: "RNA-Seq"       # the 98 miRNA-Seq single-end runs are a separate modality — excluded
      library_layout: "PAIRED"
      n_candidate_runs: 98              # PAIRED RNA-Seq runs in the BioProject (of 196 total)
      accessions: []                    # WP1b: resolve the day-21 case/recovered subset from SRA BioSample attrs
      note: "decoy (chronification triangulation); run subset + case/control split deferred to WP1b (needs BioSample metadata)"

# ------------------------------------------------------ harmonization (WP1b b)
# The SHARED gene-id identity contract: symbol/alias/RefSeq -> Ensembl-gene, built
# by code/scripts/build_gene_id_map.R from the SAME annotation authority the gene
# sets used (org.Hs.eg.db, pinned in envs/r-bioc.yaml) and the SAME multimap policy
# as genesets_reference.R ("first"), so a source symbol resolves to the SAME ENSG on
# both the expression side and the gene-set side — commensurability by construction,
# not coincidence. stage_matrix.py hash-verifies the map before use (empty => HALT,
# like every payload) and FAILS CLOSED per the guardrails: a deposit whose ids map
# too poorly (min_map_rate) or are the wrong namespace (max_mixed_namespace_frac) is
# marked contrast-INELIGIBLE, never emitted as a thin matrix the rank code would
# treat as comparable.
harmonization:
  map_tsv: "data/processed/genesets/gene_id_map.2024.1.Hs.tsv"
  map_sha256: "d07f65bdc32652064eb9f6fafd9467c5dcf0addd8530a9924eb0d2a9864eb01a"  # PINNED from the canonical org.Hs.eg.db 3.22.0 build (build_gene_id_map --use-conda r-bioc); reproducible on rebuild
  map_bytes: 20806997               # 575186 rows (SYMBOL 39386 + ALIAS 102224 + REFSEQ 433576)
  report_json: "data/processed/genesets/gene_id_map.report.json"
  source: "org.Hs.eg.db 3.22.0"     # MUST match the gene-set annotation authority (harmonize_reference.json)
  multimap_policy: first            # identical to genesets_reference.R (commensurability)
  keytypes: [SYMBOL, ALIAS, REFSEQ]
  guardrails:
    min_map_rate: 0.60              # < this fraction of source ids resolving -> ineligible (e.g. GSE143549 gene_name ~0.56 fails closed)
    max_mixed_namespace_frac: 0.05  # declared non-Ensembl but ids look ENSG -> namespace error, ineligible
    max_ambiguous_mapped_frac: 0.20 # of the MAPPED ids, fraction whose source resolves to >=2 ENSG (the "first" pick is ambiguous); a deposit mapping well but mostly through ambiguous aliases/RefSeq fails closed

# ------------------------------------------------------ parse (WP1b) ---------
# review Finding F, pulled forward into WP1b: the EXECUTABLE per-deposit ingest
# contract. One entry per GEO/FigShare deposit declaring how stage_matrix.py turns
# its verified raw payload into the uniform expr + sample_sheet + QA. Fields:
#   handler            matrix | series_matrix | soft | tar   (dispatch by payload kind)
#   payload            which acquisition payload key to parse
#   gene_id_namespace  ensembl | ensembl_versioned | symbol | refseq  (target = Ensembl gene)
#   expression_scale   counts | cpm | fpkm | tpm | log2_intensity | log_mu  (ASSERTED vs data)
#   duplicate_policy   sum | mean | max_total   (collapse rows sharing an Ensembl id)
#   group_source       column_regex | companion | deferred   (sample -> group)
#   case_label/control_label + min_per_arm + sheet_columns
#   status: deferred + deferred_reason  -> stage_matrix HALTs naming the EXACT missing
#     piece (a metadata payload not yet acquired, or a symbol/RefSeq->Ensembl map),
#     so the contract is executable, never a fabricated case/control label.
# Resolvable NOW from on-disk data (group derivable without extra metadata):
# GSE251849 (col-name prefixes) + PXD-SCILIFELAB (companion SamplesPC.txt). The
# rest are deferred with their blocker named; PRJNA1001790 is served by salmon_gene_matrix.
parse:
  GSE251849:                           # ENSG counts; group in the column-name prefix
    handler: matrix
    payload: expr
    sep: "\t"
    gene_id_col: 0
    annotation_cols: []
    gene_id_namespace: ensembl
    expression_scale: estimated_counts
    duplicate_policy: sum
    case_label: case
    control_label: control
    min_per_arm: 2
    sheet_columns: [sample, group]
    group_source:
      mode: column_regex               # 11 LongCOVID vs 12 (7 Control + 5 Convalescent), per plan "11 vs 12"
      map:
        - {pattern: "^LongCOVID", group: case}
        - {pattern: "^Control", group: control}
        - {pattern: "^Convalescent", group: control}   # pooled into control (plan corpus note)
  PXD-SCILIFELAB-28832492:             # ENSG.version counts; group in companion SamplesPC.txt
    handler: matrix
    payload: expr
    sep: "\t"
    gene_id_col: 0
    annotation_cols: [1]               # drop the gene_name column
    gene_id_namespace: ensembl_versioned
    expression_scale: estimated_counts
    duplicate_policy: sum
    case_label: case
    control_label: control
    min_per_arm: 2
    sheet_columns: [sample, group]
    group_source:
      mode: companion
      payload: samples
      sep: "\t"
      sample_col: SampleName
      condition_col: Condition
      level_map: {PAT: case, CTL: control}   # 60 PAT vs 50 CTL
      covariate_cols: [Wave, Score, Dyspnoea]
  # --- deferred: each names the EXACT blocker (metadata payload or harmonization map) ---
  GSE226260:
    handler: matrix
    payload: expr
    status: deferred
    deferred_reason: "group not in expr header (cols are internal ids p22179-sNNN); needs GSE226260 series matrix for sample->LC/control + the platform batch covariate (de_model ~ platform + group)"
  GSE270045:                           # PASS (WP1b-a): gene-id via symbol map (83%); group from the staged series matrix
    handler: matrix
    payload: expr
    metadata_payload: series_matrix     # WP1b(a): parse_geo_metadata parses this -> series_metadata.samples.tsv
    sep: "\t"
    gene_id_col: 0
    annotation_cols: []
    gene_id_namespace: symbol
    expression_scale: estimated_counts   # VERIFIED on real data (WP1b-a): the "_LC_counts" filename is a misnomer
    scale_caveat: "the GSE270045_LC_counts matrix is NOT integer counts — it is fractional EM/pseudo-alignment gene counts (values 1e-8..5e4, 43% integer-like, library-size-varying column sums 0.6M-8.7M, non-negative). Continuous → limma-only (never a DESeq2/edgeR integer model)."
    duplicate_policy: sum
    case_label: case
    control_label: control
    min_per_arm: 2
    sheet_columns: [sample, group]
    group_source:
      mode: sheet                        # join the series-matrix metadata to the expr columns
      file: series_metadata.samples.tsv  # produced by parse_geo_metadata from the staged series_matrix
      sep: "\t"
      sample_col: sample_id              # the `sample id` characteristic == expr column headers (CCI*/HP*/S*)
      group_regex_col: title             # group lives ONLY in the title (no disease-state characteristic)
      group_regex:                       # 17 Healthy Control (CCI/HP) vs 19 Long Covid (S*)
        - {pattern: "^Healthy Control", group: control}
        - {pattern: "^Long Covid", group: case}
  GSE267625:
    handler: matrix
    payload: expr
    status: deferred
    deferred_reason: "no external control — WP2 must define the within-cohort contrast (subject + timepoint); needs per-sample longitudinal metadata"
  GSE228320:
    handler: matrix
    payload: expr
    status: deferred
    deferred_reason: "continuous DLCO pulmonary-severity axis, not a two-arm contrast; needs per-sample DLCO values (series matrix) + a ~ dlco DE path"
  GSE143549:                           # gene-id map FAILS the guardrail (56% < 0.60) -> ineligible even before group
    handler: matrix
    payload: expr
    sep: "\t"
    gene_id_col: 4                     # 'Gene Symbol' column (0=Chromosome..3=Strand,4=Gene Symbol,5=gene_name,6=gene_status)
    annotation_cols: [0, 1, 2, 3, 5, 6]
    gene_id_namespace: symbol
    expression_scale: cpm              # Normalized_counts_CPM+0.0001
    duplicate_policy: sum
    case_label: case
    control_label: control
    min_per_arm: 2
    sheet_columns: [sample, group]
    status: deferred
    deferred_reason: "GENE-ID FAILS the fail-closed guardrail: 'Gene Symbol' maps only ~56% (< min_map_rate 0.60) — many NOVEL/non-coding rows (gene_status=NOVEL, 5S_rRNA). Needs a cleaner symbol source or ALIAS/coordinate lift before admission; AND survivor/control grouping from the series matrix (cols are subject ids 101-NNNN-*-J0)"
  GSE128078:                           # PASS (WP1b-a, SENSITIVITY-ONLY): RefSeq->Ensembl (90%); group from the staged series matrix
    handler: matrix
    payload: expr
    metadata_payload: series_matrix     # WP1b(a): parse_geo_metadata parses this -> series_metadata.samples.tsv
    sep: "\t"
    gene_id_col: 0                     # 'tracking_id' = RefSeq NM_ isoform accession
    annotation_cols: []
    gene_id_namespace: refseq
    expression_scale: fpkm             # FES_isoforms_FPKM
    duplicate_policy: sum              # isoform FPKM -> gene (APPROXIMATE: FPKM is not cleanly additive across isoforms)
    scale_caveat: "isoform-FPKM summed to gene is only approximately additive (FPKM normalizes by transcript length); ADMIT SENSITIVITY-ONLY unless re-quantified from reads to gene-level, or justify the sum vs a length-weighted aggregation"
    case_label: case
    control_label: control
    min_per_arm: 2
    sheet_columns: [sample, group, subject, timepoint]
    group_source:
      mode: sheet                        # join the series-matrix metadata to the expr columns (title)
      file: series_metadata.samples.tsv  # produced by parse_geo_metadata from the staged series_matrix
      sep: "\t"
      sample_col: title                  # !Sample_title == expr column headers (Sample_G<id>-<day>)
      condition_col: disease_state       # `disease state: ME/CFS | Control` characteristic
      level_map: {ME/CFS: case, Control: control}
      covariate_cols:                    # renamed to the de_models covariate names (subject, timepoint)
        - {col: individual_identifier, as: subject}   # `individual identifier: G1`
        - {col: timepoint_day, as: timepoint}          # `timepoint (day): 1|2|3|7` — multi-tp collapse is WP2
    note: "multi-timepoint (day 1/2/3/7); sheet carries subject+timepoint so WP2 collapses to one contrast per subject BEFORE limma (de_models.gse128078_mecfs stock_ok AFTER collapse). SENSITIVITY-ONLY (FPKM sum caveat)."
  GSE68310:
    handler: matrix
    payload: expr
    status: deferred
    deferred_reason: "Illumina microarray in wide AVG_Signal/Detection-Pval pairs needing probe->gene collapse + reshape; acute-influenza decoy (baseline vs day0-6), not a >=4wk contrast"
  GSE16059:                            # microarray PASS (group + twin pair INLINE in series matrix)
    handler: prebuilt                  # stage_matrix ADOPTS the upstream microarray chain's gene matrix
    payload: series_matrix             # raw provenance for origin.json
    prebuilt_expr: microarray.gene.tsv.gz
    upstream: "parse_series_matrix.py -> harmonize_microarray.R (hgu133plus2.db / GPL570) -> collapse_probes.R (median)"
    sep: "\t"
    gene_id_col: 0
    gene_id_namespace: ensembl         # collapsed genes are bare ENSG (probe->gene done upstream)
    expression_scale: log2_intensity   # GPL570 normalized log2 intensities
    duplicate_policy: mean             # log2 intensities average (defensive; none expected post-collapse)
    case_label: case
    control_label: control
    min_per_arm: 2
    sheet_columns: [sample, group, twin_pair]
    group_source:
      mode: sheet                      # the chain's samples.tsv carries group + twin pair inline
      file: microarray.samples.tsv
      sep: "\t"
      sample_col: sample
      condition_col: diagnonsis        # [sic] source spelling; values unaffected/CFS/ICF
      level_map: {unaffected: control, CFS: case}   # ICF (idiopathic CF, milder) EXCLUDED — not the CFS contrast
      covariate_cols: [twin_pair]      # discordant-twin block covariate (de_models ~ group block twin_pair)
  GSE14577:                            # microarray PASS (group INLINE; t035 chain reused verbatim)
    handler: prebuilt
    payload: soft                      # raw provenance for origin.json
    prebuilt_expr: microarray.gene.tsv.gz
    upstream: "parse_gse14577.py -> harmonize_gse14577.R (hgu133a/b.db) -> collapse_probes.R (median + U133A∪B mean)"
    sep: "\t"
    gene_id_col: 0
    gene_id_namespace: ensembl         # collapsed genes are bare ENSG
    expression_scale: log2_intensity
    duplicate_policy: mean
    case_label: case
    control_label: control
    min_per_arm: 2
    sheet_columns: [sample, group]
    group_source:
      mode: column_regex               # collapsed columns are patient_key = <group>_<n> (t035 axis)
      map:
        - {pattern: "^PI-CFS", group: case}
        - {pattern: "^HC", group: control}
  GSE130353:                           # QFS stratum (circulating monocytes); post-Q-fever fatigue
    handler: tar
    payload: raw_tar
    member_glob: "*.gene.mmseq.txt.gz"
    member_gene_col: feature_id
    member_value_col: log_mu
    member_comment: "#"                 # skip MMSEQ's "# Mapped fragments:" preamble line
    member_agg: sum                      # feature_id is unique -> no-op collapse (guards accidental dups)
    sample_id_regex: "^(GSM[0-9]+)"      # GSM from the member filename; joins to SOFT `sample`
    gene_id_namespace: ensembl           # ENSG (Ensembl release 68)
    expression_scale: log_mu
    scale_caveat: "MMSEQ posterior mean on the natural-log scale (~30% negative); the depositor 'counts' label is inaccurate — continuous limma only (DESeq2/edgeR inadmissible)."
    case_label: case
    control_label: control
    de_model: default
    metadata_payload: soft
    metadata_format: soft                # parse via parse_geo_soft (not the series-matrix parser)
    group_source:
      mode: sheet
      file: soft_metadata.samples.tsv
      sample_col: sample
      group_regex_col: subject_status
      # QFS (post-Q-fever fatigue) vs QS (Q-fever seropositive, recovered = infected-recovered
      # control). Match the parenthetical code, NOT "Fatigue Syndrom" (a substring of BOTH
      # "Q Fever Fatigue Syndrom (QFS)" and "Chronic Fatigue Syndrome (FCS)"). HC + CFS drop.
      group_regex:
        - {pattern: "\\(QFS\\)", group: case}
        - {pattern: "\\(QS\\)", group: control}
  GSE251872:                           # PI-ME/CFS RAW.tar (27 members)
    handler: tar
    payload: raw_tar
    status: deferred
    deferred_reason: "WP1b tranche (a): per-sample RAW.tar (27 GSM*_Walitt*.txt.gz) needs per-member merge + a metadata payload for group (12 cases vs 15 healthy) + platform batch covariate. Handler work alone does NOT PASS this (group is not in the tar)."
  GSE63085:                            # Lyme/PTLDS RAW.tar (97 cufflinks members, PBMC); V5 = 6-mo post-treatment
    handler: tar
    payload: raw_tar
    member_glob: "*_cuff.txt.gz"
    member_gene_col: gene_id             # cufflinks gene_short_name (symbol; == gene_id col)
    member_value_col: FPKM
    member_agg: sum                      # >1 locus/TSS per gene symbol -> sum FPKM before merge
    sample_id_regex: "^(GSM[0-9]+)"      # GSM from filename; joins to series-matrix `sample`
    gene_id_namespace: symbol            # resolves through the org.Hs.eg.db symbol map
    expression_scale: fpkm
    case_label: case
    control_label: control
    de_model: default
    metadata_payload: series_matrix
    metadata_format: series_matrix
    group_source:
      mode: sheet
      file: series_metadata.samples.tsv
      sample_col: sample
      # `time` alone selects the arm AND the visit: only Lyme has V-numbered visits and
      # controls carry time="control". V5 = 6 months post-treatment (the PTLDS-relevant
      # timepoint). Lyme V1 (acute) / V2 (3wk post-tx) drop as unmapped -> case is the
      # residual 6-mo signature vs healthy controls.
      group_regex_col: time
      group_regex:
        - {pattern: "\\(V5\\)", group: case}
        - {pattern: "^control$", group: control}

# ------------------------------------------------------ microarray chain (WP1b c)
# The probe->gene chain feeding the `prebuilt` stage_matrix handler for the two
# microarray deposits (group is INLINE, so these PASS without an extra metadata
# payload — unlike the RAW.tar deposits). probe->Ensembl uses the PLATFORM annotation
# .db (pinned in envs/r-bioc.yaml), DISTINCT from the tranche-b org.Hs.eg.db symbol
# map. GSE14577 reuses the t035 scripts verbatim (parse_gse14577 + harmonize_gse14577
# + collapse_probes); GSE16059 (GPL570) uses the generic parse_series_matrix +
# harmonize_microarray. Chain outputs land as microarray.* under the deposit's PROC
# dir; stage_matrix's `prebuilt` handler adopts microarray.gene.tsv.gz.
microarray:
  coverage_warn: 0.30                 # harmonize_gse14577.R Hallmark-coverage WARN threshold (informational)
  reference_json: "data/processed/genesets/harmonize_reference.json"  # t035 shared: hallmark genes_ensembl for the coverage note
  multimap_policy: first              # probe->Ensembl "first" (matches genesets_reference.R / build_gene_id_map.R)
  gse16059:
    platform: GPL570
    platform_db: hgu133plus2.db       # pinned in envs/r-bioc.yaml (annotation-only add)

# ------------------------------------------------------ DE model contract ----
# review Finding (2026-07-08): "reuse limma_de.R verbatim" is only valid for the
# simple two-arm `~ group` contrasts. Several corpus contrasts need a DIFFERENT
# design and CANNOT use the stock script unchanged. This block is the per-contrast
# MODEL CONTRACT (WP0): it declares the design + the extension each contrast needs
# so WP2 implements them deliberately, not by silently forcing everything through
# `~ group`. `stock_ok: true` = the plan:0003 limma_de.R suffices as-is; false =
# WP2 must extend limma_de.R (or add a variant) before this column is admitted.
# `design`/`block`/`coef` name the intended model; NES sign convention is fixed
# (case − control, or increasing-severity for a continuous axis).
de_models:
  # `covariates` names the EXACT extra sample_sheet columns (beyond sample+group)
  # this contrast's design needs. It is the contract WP1b parsers build the sheet
  # against (stage_matrix records covariate coverage in contrast_eligibility), so
  # the model spec is EXPLICIT here, not implied by the `~ group` stock script.
  default:
    design: "~ group"                 # two-arm case vs control
    coef: groupcase
    covariates: []
    stock_ok: true
  # --- contrasts that DIVERGE from the stock two-arm model ---
  gse226260_lc:
    design: "~ platform + group"      # 2-platform batch → adjust platform
    coef: groupcase
    covariates: [platform]            # sheet MUST carry a per-sample platform label
    stock_ok: false                   # stock script has no covariate term
    note: "2-platform batch covariate"
  gse251872_pimecfs:
    design: "~ platform + group"      # 2 sequencing platforms → adjust platform
    coef: groupcase
    covariates: [platform]
    stock_ok: false
    note: "2 sequencing platforms (batch)"
  gse16059_mecfs:
    design: "~ group"                 # discordant MZ twins
    block: twin_pair                  # duplicateCorrelation on twin-pair id (sheet col from series matrix)
    coef: groupcase
    covariates: [twin_pair]           # sheet MUST carry the twin-pair id
    stock_ok: false                   # stock script does not model within-pair correlation
    note: "44 discordant MZ twin pairs — paired/blocked design; ICF excluded so 12 control co-twins are unpaired (WP2 duplicateCorrelation handles unbalanced blocks)"
  gse267625_lc:
    design: "within-cohort"           # no external control; contrast built within-cohort
    coef: TODO-WP2-define             # e.g. symptomatic-timepoint vs recovered-timepoint
    covariates: [subject, timepoint]  # within-cohort contrast needs subject + timepoint
    stock_ok: false
    note: "no external control — WP2 must define the within-cohort contrast (longitudinal)"
  gse228320_lc:
    design: "~ dlco"                  # DLCO pulmonary-severity CONTINUOUS axis, not case/control
    coef: dlco
    covariates: [dlco]                # sheet MUST carry the continuous DLCO value
    stock_ok: false                   # continuous predictor, not a two-group factor
    note: "severity-axis (continuous DLCO), LOO-drop; NES = increasing-severity direction"
  gse128078_mecfs:
    design: "~ group"                 # multi-timepoint → collapse to one contrast per subject first
    coef: groupcase
    covariates: [subject, timepoint]  # needed to collapse to one contrast per subject
    stock_ok: true                    # stock model OK AFTER WP2 timepoint collapse
    note: "multi-timepoint — one-contrast-per-subject collapse upstream of limma"

# ------------------------------------------------------ rank estimators ------
# Battery of ROTATION-INVARIANT estimators (primary; R must not depend on a
# factor rotation). >=3 required for the uncertainty envelope.
rank_battery:
  parallel_analysis:
    method: horn                  # eigenvalue vs label-permuted null
    n_perm: 2000
    quantile: 0.95                # retain components above the 95th null percentile
  cv_svd:
    method: bi-cross-validation   # Owen-Perry hold-out sub-blocks
    row_folds: 4
    col_folds: 4
  split_half:
    n_splits: 200                 # principal-angle agreement between random halves
  bootstrap:
    n_boot: 1000                  # naive comparator — lower-bound sanity check only

# t116 STRUCTURAL single-axis statistic as a confirmatory CO-PRIMARY (Finding B).
# This — not the SVD rank — is the statistic interp-0037 characterized; it is what
# the R-regime grid was built for. Reported alongside R; divergence is first-class.
structural_statistic:
  name: off_diagonal_concordance_sd
  concordance: spearman           # per pair of contrast columns
  # the t116 sampling floor for concordance SD is ~1/sqrt(P-1); a low SD with high
  # mean concordance is the shared-artifact / single-axis signature.

# ------------------------------------------------------ Stage 3c calibration -
# review Finding B: the SVD rank estimator is NOT the statistic t116 characterized,
# so NO real-data R is placed on the t116 grid until the battery is calibrated
# against t116's OWN generative model at the corpus's real K/N. Inject matrices at
# KNOWN rank, confirm recovery + CI calibration. A grid verdict (Stage 5) is not
# emitted unless this passes; a calibration failure is itself the reported result.
calibration_3c:
  inject_R: [2, 4, 8]             # known generative ranks to recover
  match_concordance: true         # match off-diagonal concordance to the real matrix
  arm_bias: 0.60                  # t116 alpha — N-invariant per-arm systematic bias
  replicates: 4000
  ci_coverage_target: 0.90        # nominal CI must cover the injected R at ~this rate
  recovery_tol: 1                 # |R_hat - R_true| <= tol counts as recovered
  regime_band_must_match: true    # structural co-primary must land in the right band

# ------------------------------------------------------ LODO / LOCO folds ----
# Stage 3b pre-locked pass/fail. review Finding A: the ONLY interp-0037-grounded
# IDENTIFIABILITY threshold is arm count (K>=3 triggers). Contrast/platform counts
# are POWER covariates attached to each fold's CI — NOT binary gates.
folds:
  identifiability:
    min_triggers: 3               # t116 K>=3 — below this a fold is NON-IDENTIFIABLE
  power_covariates:               # reported with each fold's CI; NOT gates (Finding A)
    contrasts: report             # (was a hand-set min_contrasts=6 gate — demoted)
    platforms: report             # (was a hand-set min_platforms=2 gate — demoted)
  pass_rule:
    r_band: 1                     # PASS iff |R_fold - R_full| <= 1 AND ...
    regime_bands:                 # ... within the same t116 regime band ...
      low: [2, 4]
      high: [8, 999]
    subspace_angle_max_deg: 20    # ... AND leading-subspace principal angle below this
  lc_out_first_class: true        # long-COVID-out fold reported separately as a
                                  # power/CI curve (LC supplies ~8 of ~13 columns;
                                  # WB/PBMC LC-out retains 3 triggers = K=3 floor)

# ------------------------------------------------------ artifact controls ----
# review Key decision 4: artifact AND compartment controls are ADMISSIBILITY
# criteria, run BEFORE any biological reading. Two named rivals for a low-rank
# signal: a correlated shared artifact (t116) and a cell-composition-shift axis.
artifact_controls:
  platform_loo: true              # re-estimate R dropping each platform in turn
  negative_control_sets:          # carried through the identical pipeline; shared
    - housekeeping                # structure among these is the artifact floor
    - platform_associated
    - gc_confounded
  recovered_control_specificity:  # DIRECTIONAL, not magnitude (plan Artifact section)
    require_persistence: true     # shared subspace must remain present in case-vs-recovered
    require_exceed_naive: false   # do NOT require case-vs-recovered > case-vs-naive
  composition_control:            # review Finding C — three prongs
    stratified_R: true            # estimate R within each compartment stratum
    drop_sorted_sensitivity: true # low-rank must survive removing the sorted stratum
    deconvolution:
      method: cibersortx-lm22     # WB (+ partial PBMC) only; never sorted
      report_before_after: true   # R before vs after composition adjustment
      composition_as_nuisance_axis: true

# ------------------------------------------------------ WP4b specificity -----
# review Finding D: the project's designated non-infectious stress-test. GWS/FM
# (D-003) as a SEPARATE non-infectious specificity matrix under the SAME gates +
# the SAME uniform pipeline — NOT a free-form column. Gated on a public,
# downloadable, sample-level deposit clearing the gates; else a note-only gap.
specificity_readacross:
  enabled: false                  # flip true once an admissible GWS/FM deposit is found
  candidates: []                  # WP4b discovery sweep (open question #4) fills this
  gates_same_as_primary: true     # blood-bulk WB/PBMC, public, downloadable, sample-level
  pipeline_same_as_primary: true  # same DE->enrichment over the same pinned universe
  test: subspace_recovery_fraction # how much of the PAIS subspace GWS/FM recovers (Q-D)
  no_deposit_is_note_only: true   # if none admissible: record the gap, do NOT relax gates

# ------------------------------------------------------ t116 grid ------------
# The R-regime grid (interpretation:0037) the surviving R + structural co-primary
# are placed on — ONLY after Stage 3c passes (Finding B). Wording is scoped to
# "achievable arm counts under this test family", not "any N" (Key decision 5).
grid:
  low_rank_arbitrable: [2, 4]     # q0050 GO (with the t116 conditions)
  high_rank_nonarbitrating: [8, 999]  # q0050 NO-GO / redesign
  straddle_reported: true

# ------------------------------------------------------ paths ----------------
# data/raw + data/processed are the off-Dropbox gitignored symlinks; results/* is
# gitignored (regenerable). The committed reproducibility contract is this
# workflow (Snakefile + config + scripts), not the outputs.
paths:
  raw: "data/raw/t117"
  processed: "data/processed/t117"
  results: "results/t117-crosspais-rank"

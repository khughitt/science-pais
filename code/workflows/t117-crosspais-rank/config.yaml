# =============================================================================
# config.yaml — cross-PAIS pathway-response effective-rank estimation (task:t117)
#
# SINGLE encoding of the analysis's design parameters. The workflow scripts read
# these and hard-code NOTHING; changing a value here is a deliberate edit that
# re-defines the reported estimate. This file ORIGINATES the design.
#
# Design:  entities/plans/0010-crosspais-pathway-response-rank-estimation.md
# Review:  doc/reviews/0010-crosspais-pathway-response-rank-estimation-pipeline-review.md
# Grounds: interpretation:0037-t116-power-bias-floor-shared-axis-sim (the R-regime
#          grid + the K>=3 identifiability lever this plan re-grounds on)
#
# WP0 status: SKELETON. All params are encoded here; the Snakefile wires the full
# DAG (staged matrices -> results/grid) so `snakemake -n` resolves; rule bodies
# are fail-early stubs until WP2-WP6 implement them.
#
# Estimand (frozen): the reproducible effective rank R of the cross-trigger PAIS
# pathway-response subspace, from independently derived case-vs-control
# pathway-effect vectors, uniform DE/enrichment over ONE pinned gene-set universe,
# with dataset/condition leave-one-out stability as the primary believability
# criterion.
# =============================================================================

# ------------------------------------------------------ determinism ----------
# One master seed + explicit PER-ESTIMATOR substreams (review Finding G / Repro):
# every stochastic estimator gets its own pinned seed so results are independent
# of execution order / worker count.
determinism:
  master_seed: 1729               # echoes the t116/t035 determinism seed
  seeds:
    parallel_analysis_perm: 17290 # Horn parallel-analysis label-permutation null
    cv_svd_fold: 17291            # bi-cross-validation SVD sub-block hold-out split
    split_half: 17292             # split-half subspace-stability random halving
    bootstrap: 17293              # naive-bootstrap lower-bound comparator
    bicmix_mcmc: 17294            # sparse-FA (BicMix/SFAmix) MCMC seed
    calibration_gen: 17295        # Stage-3c synthetic-matrix generator (t116 model)
  bicmix:                         # sparse-FA convergence contract (Stage 4 / WP5)
    chains: 4
    iterations: 20000
    burnin: 10000
    rhat_max: 1.05                # Gelman-Rubin convergence gate; exceed -> FAIL

# ------------------------------------------------------ gene-set universe ----
# ONE pinned high-resolution universe (~1000 sets) — the t116 finding that this
# resolution is what drops the required arm count to K~=3. NOT a multi-DB fan-out;
# every contrast meets at the NES level over this single universe.
genesets:
  universe_id: "dataset:msigdb-2024-1-hs-mapped-pais-gene-set-universe"
  msigdb_release: "2024.1.Hs"
  universe_rds: "data/processed/genesets/pais_universe.2024.1.Hs.rds"
  universe_sha256: "TODO-pin-in-WP1-staging"   # locked hash; verified before consumption
  size_filter:
    min: 10
    max: 500

# ------------------------------------------------------ compartments ---------
# review Finding C: the PRIMARY matrix is whole-blood / PBMC bulk only. Sorted
# leukocytes are a SEPARATE compartment stratum, never pooled into the primary
# rank matrix (a shared cross-trigger axis across mixed compartments can be a
# cell-composition shift, not pathway biology). Deconvolution is valid only where
# marked (WB, partial PBMC) — NOT for sorted compartments.
compartments:
  primary: [whole_blood, pbmc]     # feed the strict-primary rank matrix
  stratum_only: [sorted]           # compartment-stratified R only
  deconvolvable: [whole_blood, pbmc]  # composition-adjustment applies here only

# ------------------------------------------------------ corpus / contrasts ---

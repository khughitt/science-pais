# ------------------------------------------------------ rank estimators ------
# Battery of ROTATION-INVARIANT estimators (primary; R must not depend on a
# factor rotation). >=3 required for the uncertainty envelope.
rank_battery:
  parallel_analysis:
    method: horn                  # eigenvalue vs label-permuted null
    n_perm: 2000
    quantile: 0.95                # retain components above the 95th null percentile
  cv_svd:
    method: bi-cross-validation   # Owen-Perry hold-out sub-blocks
    row_folds: 4
    col_folds: 4
  split_half:
    n_splits: 200                 # principal-angle agreement between random halves
  bootstrap:
    n_boot: 1000                  # naive comparator — lower-bound sanity check only

# t116 STRUCTURAL single-axis statistic as a confirmatory CO-PRIMARY (Finding B).
# This — not the SVD rank — is the statistic interp-0037 characterized; it is what
# the R-regime grid was built for. Reported alongside R; divergence is first-class.
structural_statistic:
  name: off_diagonal_concordance_sd
  concordance: spearman           # per pair of contrast columns
  # the t116 sampling floor for concordance SD is ~1/sqrt(P-1); a low SD with high
  # mean concordance is the shared-artifact / single-axis signature.

# ------------------------------------------------------ Stage 3c calibration -
# review Finding B: the SVD rank estimator is NOT the statistic t116 characterized,
# so NO real-data R is placed on the t116 grid until the battery is calibrated
# against t116's OWN generative model at the corpus's real K/N. Inject matrices at
# KNOWN rank, confirm recovery + CI calibration. A grid verdict (Stage 5) is not
# emitted unless this passes; a calibration failure is itself the reported result.
calibration_3c:
  inject_R: [2, 4, 8]             # known generative ranks to recover
  match_concordance: true         # match off-diagonal concordance to the real matrix
  arm_bias: 0.60                  # t116 alpha — N-invariant per-arm systematic bias
  replicates: 4000
  ci_coverage_target: 0.90        # nominal CI must cover the injected R at ~this rate
  recovery_tol: 1                 # |R_hat - R_true| <= tol counts as recovered
  regime_band_must_match: true    # structural co-primary must land in the right band

# ------------------------------------------------------ LODO / LOCO folds ----
# Stage 3b pre-locked pass/fail. review Finding A: the ONLY interp-0037-grounded
# IDENTIFIABILITY threshold is arm count (K>=3 triggers). Contrast/platform counts
# are POWER covariates attached to each fold's CI — NOT binary gates.
folds:
  identifiability:
    min_triggers: 3               # t116 K>=3 — below this a fold is NON-IDENTIFIABLE
  power_covariates:               # reported with each fold's CI; NOT gates (Finding A)
    contrasts: report             # (was a hand-set min_contrasts=6 gate — demoted)
    platforms: report             # (was a hand-set min_platforms=2 gate — demoted)
  pass_rule:
    r_band: 1                     # PASS iff |R_fold - R_full| <= 1 AND ...
    regime_bands:                 # ... within the same t116 regime band ...
      low: [2, 4]
      high: [8, 999]
    subspace_angle_max_deg: 20    # ... AND leading-subspace principal angle below this
  lc_out_first_class: true        # long-COVID-out fold reported separately as a
                                  # power/CI curve (LC supplies ~8 of ~13 columns;
                                  # WB/PBMC LC-out retains 3 triggers = K=3 floor)

# ------------------------------------------------------ artifact controls ----
# review Key decision 4: artifact AND compartment controls are ADMISSIBILITY
# criteria, run BEFORE any biological reading. Two named rivals for a low-rank
# signal: a correlated shared artifact (t116) and a cell-composition-shift axis.
artifact_controls:
  platform_loo: true              # re-estimate R dropping each platform in turn
  negative_control_sets:          # carried through the identical pipeline; shared
    - housekeeping                # structure among these is the artifact floor
    - platform_associated
    - gc_confounded
  recovered_control_specificity:  # DIRECTIONAL, not magnitude (plan Artifact section)
    require_persistence: true     # shared subspace must remain present in case-vs-recovered
    require_exceed_naive: false   # do NOT require case-vs-recovered > case-vs-naive
  composition_control:            # review Finding C — three prongs
    stratified_R: true            # estimate R within each compartment stratum
    drop_sorted_sensitivity: true # low-rank must survive removing the sorted stratum
    deconvolution:
      method: cibersortx-lm22     # WB (+ partial PBMC) only; never sorted
      report_before_after: true   # R before vs after composition adjustment
      composition_as_nuisance_axis: true

# ------------------------------------------------------ WP4b specificity -----
# review Finding D: the project's designated non-infectious stress-test. GWS/FM
# (D-003) as a SEPARATE non-infectious specificity matrix under the SAME gates +
# the SAME uniform pipeline — NOT a free-form column. Gated on a public,
# downloadable, sample-level deposit clearing the gates; else a note-only gap.
specificity_readacross:
  enabled: false                  # flip true once an admissible GWS/FM deposit is found
  candidates: []                  # WP4b discovery sweep (open question #4) fills this
  gates_same_as_primary: true     # blood-bulk WB/PBMC, public, downloadable, sample-level
  pipeline_same_as_primary: true  # same DE->enrichment over the same pinned universe
  test: subspace_recovery_fraction # how much of the PAIS subspace GWS/FM recovers (Q-D)
  no_deposit_is_note_only: true   # if none admissible: record the gap, do NOT relax gates

# ------------------------------------------------------ t116 grid ------------
# The R-regime grid (interpretation:0037) the surviving R + structural co-primary
# are placed on — ONLY after Stage 3c passes (Finding B). Wording is scoped to
# "achievable arm counts under this test family", not "any N" (Key decision 5).
grid:
  low_rank_arbitrable: [2, 4]     # q0050 GO (with the t116 conditions)
  high_rank_nonarbitrating: [8, 999]  # q0050 NO-GO / redesign
  straddle_reported: true

# ------------------------------------------------------ paths ----------------
# data/raw + data/processed are the off-Dropbox gitignored symlinks; results/* is
# gitignored (regenerable). The committed reproducibility contract is this
# workflow (Snakefile + config + scripts), not the outputs.
paths:
  raw: "data/raw/t117"
  processed: "data/processed/t117"
  results: "results/t117-crosspais-rank"
